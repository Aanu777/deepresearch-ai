name: AI Regression Evals

on:
  pull_request:
    branches:
      - MAIN
  push:
    branches:
      - MAIN
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evals:
    name: Offline AI regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run deterministic AI evals
        run: python scripts/run_evals.py
